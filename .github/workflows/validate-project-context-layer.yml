name: Validate Project Context Layer

on:
  push:
    branches: [main]
    paths:
      - "agents/project-context-layer/**"
      - ".github/workflows/validate-project-context-layer.yml"
  pull_request:
    branches: [main]
    paths:
      - "agents/project-context-layer/**"
      - ".github/workflows/validate-project-context-layer.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agents/project-context-layer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate agent frontmatter
        shell: pwsh
        run: |
          $agent = "project-context-layer.agent.md"
          if (-not (Test-Path $agent)) { throw "Missing agent file: $agent" }
          $text = Get-Content $agent -Raw
          if ($text -notmatch "(?ms)^---\s.*\bname:\s*Project Context Layer\b.*\bdescription:\s*.+?---") {
            throw "Agent frontmatter is missing required name/description."
          }
          Write-Host "Frontmatter OK."

      - name: Scan for personal or tenant data
        shell: pwsh
        run: |
          $patterns = @("reply\.com","a[._]lees","v-anlees","b00367e2-193a-4f48-94de-7245d45c0947",[char]0x2014,[char]0x2013)
          $hits = @()
          Get-ChildItem -Recurse -File -Include *.md,*.ps1,*.json,*.py,*.txt |
            ForEach-Object {
              $content = Get-Content $_.FullName -Raw
              foreach ($p in $patterns) {
                if ($content -match $p) { $hits += "$($_.Name): /$p/" }
              }
            }
          if ($hits) { $hits | ForEach-Object { Write-Error $_ }; throw "Forbidden content found." }
          Write-Host "No personal or tenant data found."

      - name: Smoke test the knowledge base
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          $cfg = Get-Content context_layer/config.example.json -Raw | ConvertFrom-Json
          $cfg.artifacts_dirs = @{ ProjectX = (Resolve-Path samples).Path }
          $cfg.seed_terms = @("ProjectX","SystemA","SystemB","release","intake")
          $cfg | ConvertTo-Json -Depth 8 | Set-Content context_layer/config.json -Encoding utf8
          python -m context_layer.context_cli backfill
          if ($LASTEXITCODE -ne 0) { throw "backfill failed" }
          python -m context_layer.context_cli status
          if ($LASTEXITCODE -ne 0) { throw "status failed" }
          Remove-Item context_layer/config.json -Force
          Write-Host "Smoke test OK."
