name: Validate RAID Review Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate example configuration
        run: python scripts/raid_workbook.py validate-json raid-config.schema.json config/raid-config.example.json
      - name: Inspect included template
        run: python scripts/raid_workbook.py inspect templates/Workback_RAID_Template.xlsx
      - name: Run tests
        run: python -m pytest -q
      - name: Reject runtime data
        shell: pwsh
        run: |
          if (Test-Path config/raid-config.json) { throw 'Runtime configuration must not be committed.' }
          $generated = Get-ChildItem output -File -ErrorAction SilentlyContinue | Where-Object Name -ne '.gitkeep'
          if ($generated) { throw 'Generated output must not be committed.' }